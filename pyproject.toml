[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools-scm[simple]>=8",
    "setuptools>=80"
]

[project]
authors = [
    {email = "tim@cerazone.net", name = "Tim Cera"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules"
] # Get strings from http://pypi.python.org/pypi?%3Aaction=list_classifiers
dependencies = [
    "dateparser",
    "numpy",
    "openpyxl",
    "pandas[excel]",
    "pint",
    "pint-pandas",
    "pydantic >=2",
    "scipy",
    "tables",
    "tabulate"
]
description = "Command line script and Python library to read HSP2 HDF5 files."
dynamic = ["readme", "version"]
keywords = [
    "cli",
    "cli-application",
    "command line",
    "hsp2",
    "hspf",
    "hydrologic",
    "hydrology",
    "python",
    "script",
    "simulation",
    "time-series"
]
license = {text = "BSD-3-Clause"}
name = "hsp2_reader"
requires-python = ">=3.10"

[project.scripts]
hsp2_reader = "hsp2_reader.hsp2_reader:main"

[project.urls]
bitbucket = "https://bitbucket.org/timcera/hsp2_reader/src/main/"
documentation = "https://timcera.bitbucket.io/hsp2_reader/docs/index.html#hsp2_reader-documentation"
github = "https://github.com/timcera/hsp2_reader"

[tool.commitizen]
multiline = true
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version = "0.1.1"
version_files = ["VERSION"]

[tool.isort]
profile = "black"

[tool.jupytext]
formats = "auto:percent"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.ruff]
exclude = [
    "src/*/toolbox_utils/**/*.py"
]
fix = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort.import-heading]
first-party = "First party imports"
future = "Future imports"
local-folder = "Local folder imports"
standard-library = "Standard library imports"
third-party = "Third party imports"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE.txt"]

[tool.setuptools.dynamic]
readme = {file = "README.rst"}
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
